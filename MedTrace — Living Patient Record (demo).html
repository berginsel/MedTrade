<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedTrace — Living Patient Record (demo)</title>
<style>
:root{--bg:#F6F8FB;--sf:#fff;--tx:#172B4D;--mu:#64748B;--bd:#E2E8F0;--nv:#10233F;--bl:#2563EB;--tl:#0F9D91;--am:#B45309;--amb:#FEF3C7;--gn:#047857;--gnb:#D1FAE5;--rd:#B4443C;--rdb:#FBE9E7;--gy:#EEF2F7;--mk:#FFF1B8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1626;--sf:#13233A;--tx:#E6EDF7;--mu:#9AABC2;--bd:#25384F;--nv:#0A1424;--bl:#6EA0FF;--tl:#3CC5B8;--am:#F5C16C;--amb:#3A2E10;--gn:#6EE0B2;--gnb:#0F3A2C;--rd:#F29A92;--rdb:#401F1D;--gy:#1A2D45;--mk:#5A4A10}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0;color:var(--tx);font-weight:600}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
nav{background:var(--nv);color:#cfe0f5;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .brand{font:600 20px "Source Serif 4",Georgia,serif;color:#fff;padding:4px 10px 4px}
nav .tag{font-size:12px;color:#8fa6c4;padding:0 10px 16px}
nav a{color:#cfe0f5;text-decoration:none;padding:9px 10px;border-radius:6px;display:flex;gap:10px;align-items:center}
nav a:hover{background:#ffffff14}nav a.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 var(--tl)}
nav .sp{flex:1}nav label{font-size:12px;color:#8fa6c4;padding:0 10px}
nav select{margin:2px 0 8px;background:#ffffff14;border:1px solid #ffffff30;border-radius:6px;padding:7px;color:#fff}
nav select option{color:#172B4D}
.rst{background:none;border:1px solid #ffffff40;color:#cfe0f5;border-radius:6px;padding:7px}
main{padding:0 28px 40px;min-width:0}
.ban{background:var(--amb);color:var(--am);font-size:13px;padding:6px 12px;margin:0 -28px 20px;display:flex;gap:10px;align-items:center}
.ban b{background:var(--am);color:var(--amb);padding:1px 7px;border-radius:4px;font-size:12px}
.sub{color:var(--mu);margin:2px 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;box-shadow:0 1px 2px #10233f0d}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.met{font:600 30px "Source Serif 4",Georgia,serif}.met+div{color:var(--mu);font-size:13px}
.bdg{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pending{background:var(--amb);color:var(--am)}.approved{background:var(--gnb);color:var(--gn)}.rejected{background:var(--rdb);color:var(--rd)}.superseded{background:var(--gy);color:var(--mu)}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:6px;padding:7px 13px;font-weight:600}
.btn.p{background:var(--bl);border-color:var(--bl);color:#fff}.btn.d{color:var(--rd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;color:var(--mu);font-weight:600;font-size:13px;padding:8px;border-bottom:1px solid var(--bd)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}.tbl tr.cl{cursor:pointer}.tbl tr.cl:hover{background:var(--gy)}
.sc{overflow-x:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0}.tabs a{padding:8px 14px;color:var(--mu);text-decoration:none;border-bottom:2px solid transparent}.tabs a.on{color:var(--tx);border-color:var(--tl);font-weight:600}
input,select,textarea{border:1px solid var(--bd);background:var(--sf);border-radius:6px;padding:8px 10px}
.src{white-space:pre-wrap;font:14px/1.7 ui-monospace,Consolas,monospace;background:var(--gy);padding:14px;border-radius:6px}
mark{background:var(--mk);color:inherit;padding:1px 2px;border-radius:2px}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl>.it{position:relative;margin-bottom:12px}
.tl>.it:before{content:"";position:absolute;left:-25px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--sf);border:2px solid var(--tl)}
.tl>.it.pending:before{border-color:var(--am)}.tl>.it.rejected:before{border-color:var(--rd)}.tl>.it.superseded:before{border-color:var(--mu)}
.ev{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}.ev:hover{border-color:var(--bl)}
.pv{border-left:2px solid var(--tl);margin-left:10px;padding-left:16px}.pv .nd{display:block;text-align:left;width:100%;margin:0 0 10px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.pv .nd.miss{border-style:dashed;color:var(--rd);background:var(--rdb)}.pv .nd:hover:not(.miss){border-color:var(--bl)}
.vh{font-family:"Source Serif 4",Georgia,serif;margin:18px 0 8px;font-weight:600}
.ov{position:fixed;inset:0;background:#0a142480;display:flex;justify-content:flex-end;z-index:20}.ov.c{justify-content:center;align-items:center}
.dr{background:var(--sf);width:min(460px,100%);height:100%;overflow:auto;padding:20px;animation:sl .18s ease-out}
.md{background:var(--sf);width:min(440px,92%);border-radius:10px;padding:20px}
@keyframes sl{from{transform:translateX(24px);opacity:0}}
.msg{padding:10px 14px;border-radius:8px;margin-bottom:10px;max-width:640px}.msg.u{background:var(--bl);color:#fff;margin-left:auto}.msg.a{background:var(--sf);border:1px solid var(--bd)}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:5px 12px;font-size:13px}
.cite{border:1px solid var(--tl);color:var(--tl);background:none;border-radius:4px;padding:1px 7px;font-size:12px;margin:2px 4px 0 0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 16px;border-radius:8px;z-index:30;display:none}
.df del{background:var(--rdb);color:var(--rd)}.df ins{background:var(--gnb);color:var(--gn);text-decoration:none}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav .tag,nav .sp,nav label{display:none}main{padding:0 14px 30px}.ban{margin:0 -14px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--tx:#1B2430;--mu:#5F6B7A;--bd:#DADFE6;--bl:#0B6B8A;--tl:#0E7C74;--gy:#EDF0F3;font-family:"Public Sans","Segoe UI",system-ui,sans-serif}
body{font-family:"Public Sans","Segoe UI",system-ui,sans-serif;font-size:15px}
h1,h2,h3,.met,.brand,.vh{font-family:inherit;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}
nav{background:var(--sf);color:var(--tx);border-right:1px solid var(--bd)}
nav .brand{color:var(--tx);font-size:19px}nav .tag,nav label{color:var(--mu)}
nav a{color:var(--tx);border-radius:4px}nav a:hover{background:var(--gy)}nav a.on{background:var(--gy);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--tl)}
nav select{background:var(--sf);border:1px solid var(--bd);color:var(--tx)}nav select option{color:#1B2430}
.rst{border:1px solid var(--bd);color:var(--mu);border-radius:4px}
.ban{background:none;border-bottom:1px solid var(--bd);color:var(--mu);padding:8px 28px;margin:0 -28px 22px;font-size:13px}
.ban b{background:var(--gy);color:var(--tx);border-radius:3px}
.card{border-radius:4px;box-shadow:none}.bdg{border-radius:4px}.btn{border-radius:4px}.btn.p{background:var(--tl);border-color:var(--tl)}
input,select,textarea{border-radius:4px}
.strip{display:flex;flex-wrap:wrap;gap:36px;padding:2px 0 18px;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.strip a{text-decoration:none;color:var(--tx)}.strip b{display:block;font-size:28px;font-weight:600;line-height:1.1}.strip span{color:var(--mu);font-size:13px}
.drop{display:block;border:1.5px dashed var(--bd);border-radius:4px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--sf);margin-bottom:14px}.drop:hover{border-color:var(--tl)}
.bar{height:6px;background:var(--gy);border-radius:3px;overflow:hidden;max-width:420px}.bar i{display:block;height:100%;background:var(--tl);transition:width .15s}
.rec{background:var(--rd)!important;border-color:var(--rd)!important;color:#fff!important}
.dr{width:min(580px,100%)}
.pg{display:flex;align-items:stretch;overflow-x:auto;padding:4px 0 10px}
.gn{flex:0 0 auto;width:118px;text-align:left;background:var(--sf);border:1px solid var(--bd);border-top:3px solid var(--mu);border-radius:4px;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
.gn:hover{border-color:var(--bl)}.gn.on{box-shadow:0 0 0 2px var(--bl)}.gn.ok{border-top-color:var(--gn)}.gn.pend{border-top-color:var(--am)}.gn.miss{border-top-color:var(--rd);border-style:dashed}.gn.cor{border-top-color:var(--bl)}
.gn small{display:block;color:var(--mu);font-size:12px;overflow-wrap:anywhere}.gn b{font-size:13px}
.gl{flex:0 0 18px;align-self:center;height:2px;background:var(--bd)}
#gd{margin-top:8px;padding:12px;background:var(--gy);border-radius:4px;animation:sl .15s ease-out}
.hk{background:var(--mk);cursor:pointer;border-radius:2px;opacity:.65}.hk.on{opacity:1;outline:2px solid var(--bl)}
.fl{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;margin-bottom:8px}.fl.on{border-color:var(--bl);box-shadow:0 0 0 2px var(--bl)}
.vt{display:flex;gap:8px;flex-wrap:wrap}.vt .btn.on{background:var(--tl);color:#fff;border-color:var(--tl)}
.chg td{background:var(--amb)}
</style></head><body>
<div class="app"><nav aria-label="Main"><div class="brand">MedTrace</div><div class="tag">Source-linked patient records</div><div id="nv"></div><div class="sp"></div><label for="role">Demo role (simulated)</label><select id="role"></select><button class="rst" onclick="resetDemo()">Reset demo data</button></nav>
<main><div class="ban"><b>DEMO MODE</b><span>Fictional patient data. AI-generated information requires clinician verification. Extraction and approvals are simulated and stored only in this browser.</span></div><div id="v"></div></main></div>
<div id="ov"></div><div id="toast" role="status"></div>
<script>
const P=[{id:'p1',mrn:'DEMO001',name:'Arjun Sharma',age:54,sex:'M',hx:'Type 2 diabetes and hypertension (as recorded in source documents)'},
{id:'p2',mrn:'DEMO002',name:'Meera Iyer',age:41,sex:'F',hx:'Hypothyroidism (as recorded in source documents)'},
{id:'p3',mrn:'DEMO003',name:'Kabir Rao',age:67,sex:'M',hx:'Post-discharge cardiac follow-up (as recorded in source documents)'}];
const DOCS=[
{id:'d0',pid:'p1',name:'HbA1c_Feb2026.pdf',cat:'Laboratory report',date:'2026-02-10',snip:'HbA1c: 8.4 %',text:'CITY LAB (fictional)\nPatient: DEMO001\nCollected: 10 Feb 2026\n\nHbA1c: 8.4 %   (ref 4.0-5.6)\nFasting glucose: 162 mg/dL'},
{id:'d1',pid:'p1',name:'HbA1c_Aug2026.pdf',cat:'Laboratory report',date:'2026-08-12',snip:'HbA1c: 7.9 %',text:'CITY LAB (fictional)\nPatient: DEMO001\nCollected: 12 Aug 2026\n\nHbA1c: 7.9 %   (ref 4.0-5.6)\nLipid panel: pending'},
{id:'d2',pid:'p1',name:'Consult_Note_Sep2026.pdf',cat:'Consultation note',date:'2026-09-02',snip:'Metformin 500 mg twice daily after meals',text:'Consultation note (fictional)\nPatient: DEMO001   Date: 02 Sep 2026\n\nPatient reports good adherence. Plan: Continue Metformin 500 mg twice daily after meals. Review in 3 months.'},
{id:'d3',pid:'p1',name:'HbA1c_Aug2026_Corrected.pdf',cat:'Laboratory report',date:'2026-09-20',snip:'Corrected value: 7.2 %',text:'CITY LAB - CORRECTION NOTICE (fictional)\nPatient: DEMO001   Sample: 12 Aug 2026\n\nTest: HbA1c\nOriginal reported result: 7.9 %\nCorrected value: 7.2 %\nReason: analyzer calibration error'},
{id:'d4',pid:'p2',name:'Creatinine_Oct2026.png',cat:'Laboratory report',date:'2026-10-05',snip:'Creatinine: 0.9 mg/dL',text:'CITY LAB (fictional)\nPatient: DEMO002\nCollected: 05 Oct 2026\n\nCreatinine: 0.9 mg/dL   (ref 0.6-1.1)'},
{id:'d5',pid:'p3',name:'Rx_Discharge_Sep2026.pdf',cat:'Prescription',date:'2026-09-28',snip:'Aspirin 75 mg once daily',text:'Discharge prescription (fictional)\nPatient: DEMO003   Date: 28 Sep 2026\n\nAspirin 75 mg once daily after food.'}];
const seed=()=>({ev:[
{id:'e0',pid:'p1',type:'Laboratory',fld:'HbA1c',val:'8.4',unit:'%',title:'HbA1c 8.4 %',date:'2026-02-10',st:'approved',doc:'d0',by:'Lab Technician',ver:1},
{id:'e1',pid:'p1',type:'Laboratory',fld:'HbA1c',val:'7.9',unit:'%',title:'HbA1c 7.9 %',date:'2026-08-12',st:'superseded',doc:'d1',by:'Lab Technician',ver:1},
{id:'e1b',pid:'p1',type:'Laboratory',fld:'HbA1c',val:'7.2',unit:'%',title:'HbA1c 7.2 % (corrected)',date:'2026-09-20',st:'approved',doc:'d3',by:'Lab Technician',ver:2,sup:'e1',why:'Lab issued correction notice: analyzer calibration error'},
{id:'e2',pid:'p1',type:'Consultation',fld:'Medication text',val:'Metformin 500 mg twice daily after meals',unit:'',title:'Consultation note: medication text',date:'2026-09-02',st:'pending',doc:'d2',by:'Nurse',ver:1},
{id:'e3',pid:'p2',type:'Laboratory',fld:'Creatinine',val:'0.9',unit:'mg/dL',title:'Creatinine 0.9 mg/dL',date:'2026-10-05',st:'pending',doc:'d4',by:'Lab Technician',ver:1},
{id:'e4',pid:'p3',type:'Prescription',fld:'Medication text',val:'Aspirin 750 mg once daily',unit:'',title:'Prescription: medication text',date:'2026-09-28',st:'rejected',doc:'d5',by:'Nurse',ver:1}],
au:[
{id:'a1',t:'2026-08-12 10:02',actor:'Extraction (simulated)',role:'System',act:'Suggestion created',ev:'e1',sum:'Suggested HbA1c 7.9 % from HbA1c_Aug2026.pdf'},
{id:'a2',t:'2026-08-13 09:15',actor:'Dr. Nisha Menon',role:'Doctor',act:'Approved',ev:'e1',sum:'Approved HbA1c 7.9 %',prev:'',next:'7.9 %'},
{id:'a3',t:'2026-09-20 11:40',actor:'Extraction (simulated)',role:'System',act:'Suggestion created',ev:'e1b',sum:'Suggested corrected HbA1c 7.2 % from correction notice'},
{id:'a4',t:'2026-09-21 08:50',actor:'Dr. Nisha Menon',role:'Doctor',act:'Approved correction',ev:'e1b',sum:'Corrected HbA1c 7.9 % to 7.2 %; v1 retained',prev:'7.9 %',next:'7.2 %'},
{id:'a5',t:'2026-09-28 16:20',actor:'Extraction (simulated)',role:'System',act:'Suggestion created',ev:'e4',sum:'Suggested Aspirin 750 mg once daily'},
{id:'a6',t:'2026-09-29 09:05',actor:'Dr. Nisha Menon',role:'Doctor',act:'Rejected',ev:'e4',sum:'Rejected: suggested 750 mg does not match source (75 mg)',prev:'Aspirin 750 mg once daily',next:'(not recorded)'},
{id:'a7',t:'2026-09-02 12:00',actor:'Extraction (simulated)',role:'System',act:'Suggestion created',ev:'e2',sum:'Suggested medication text from consultation note'},
{id:'a8',t:'2026-10-05 14:30',actor:'Extraction (simulated)',role:'System',act:'Suggestion created',ev:'e3',sum:'Suggested Creatinine 0.9 mg/dL'}]});
let S;try{S=JSON.parse(localStorage.getItem('mt1'))}catch(e){}
if(!S||!S.ev)S=seed();
let role='Doctor',msgs=[],askP='p1';
const ME={Doctor:'Dr. Nisha Menon','Nurse':'Nurse Ravi Kumar','Lab Technician':'Tech Anil Das',Admin:'Admin Priya Nair'};
const save=()=>{try{localStorage.setItem('mt1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const pt=id=>P.find(p=>p.id===id),dc=id=>DOCS.find(d=>d.id===id),ev=id=>S.ev.find(e=>e.id===id);
const ic={pending:'◔ Pending review',approved:'✓ Approved',rejected:'✕ Rejected',superseded:'↺ Superseded'};
const bd=s=>`<span class="bdg ${s}">${ic[s]}</span>`;
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function resetDemo(){DOCS.length=6;S=seed();save();msgs=[];toast('Demo data reset to initial state');route()}
function modal(h){$('#ov').innerHTML=`<div class="ov c" onclick="if(event.target===this)closeM()"><div class="md" role="dialog" aria-modal="true">${h}</div></div>`}
function drawer(h){$('#ov').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="dr" role="dialog" aria-modal="true"><button class="btn" onclick="closeM()" style="float:right">Close</button>${h}</div></div>`}
function closeM(){$('#ov').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
const hl=(d,s)=>{s=s||d.snip;return d.text.replace(s,()=>'<mark>'+s+'</mark>')};
function docView(id){const d=dc(id);if(!d)return`<div class="nd miss">Source document missing</div>`;
return`<h2>${d.name}</h2><p class="mu">${d.cat} · ${pt(d.pid).name} (${pt(d.pid).mrn}) · ${d.date}<br>Synthetic document preview (fictional data)</p><div class="src">${hl(d)}</div><p class="mu">Highlighted text is the source snippet the record is linked to.</p>
<div class="row"><button class="btn" onclick="go('#/patient/${d.pid}/documents')">Open patient</button></div>`}
function openDoc(id){drawer(docView(id))}
function openEv(id){const e=ev(id),d=dc(e.doc),prev=e.sup&&ev(e.sup),next=S.ev.find(x=>x.sup===id);
const rv=S.au.filter(a=>a.ev===id&&/Approved|Rejected/.test(a.act)).pop();
drawer(`<h2>${e.title}</h2><div class="row" style="margin:8px 0">${bd(e.st)}<span class="mu">v${e.ver} · ${e.type} · ${e.date}</span></div>
<p><b>${e.fld}:</b> ${e.val} ${e.unit}</p><p class="mu">Submitted via ${e.by}. ${rv?`Reviewed by ${rv.actor} at ${rv.t}.`:e.st==='pending'?'Awaiting clinician review.':'No review decision on record.'}${e.why?`<br>Correction reason: ${e.why}`:''}</p>
${d?`<h3>Source</h3><p><button class="cite" onclick="openDoc('${d.id}')">${d.name}</button></p><div class="src">${hl(d,e.snip)}</div>`:`<div class="nd miss" style="padding:10px;border:1px dashed var(--rd);border-radius:8px">No source document attached</div>`}
${prev?`<p>Replaces: <button class="cite" onclick="openEv('${prev.id}')">${prev.title} (v${prev.ver})</button></p>`:''}${next?`<p>Replaced by: <button class="cite" onclick="openEv('${next.id}')">${next.title} (v${next.ver})</button></p>`:''}
<h3 style="margin-top:14px">How this record got here</h3>${graph(e.id)}<div class="row" style="margin-top:12px"><button class="btn" onclick="go('#/evidence/${e.id}')">Evidence inspector</button>${chainOf(e).length>1?`<button class="btn" onclick="go('#/versions/${e.id}')">Version history</button>`:`<span class="mu">No earlier versions</span>`}<button class="btn p" onclick="go('#/why/${e.id}')">Why did this change?</button>
${e.st==='pending'?`<button class="btn" onclick="go('#/review/${e.id}')">Open review</button>`:''}
${e.st==='approved'&&!next?`<button class="btn" ${role!=='Doctor'?'disabled title="Doctor role required (simulated)"':''} onclick="corrM('${e.id}')">Submit correction</button>`:''}</div>`)}
function corrM(id){const e=ev(id);modal(`<h2>Correct ${e.fld}</h2><p class="mu">The current version (v${e.ver}) will be kept as history. A new version is created.</p>
<p><label>New value<br><input id="cv" value="${e.val}" style="width:100%"></label></p><p><label>Reason for correction<br><input id="cr" style="width:100%" placeholder="Required"></label></p><p id="ce" style="color:var(--rd)"></p>
<div class="row"><button class="btn p" onclick="doCorr('${id}')">Create version ${e.ver+1}</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function doCorr(id){const e=ev(id),v=$('#cv').value.trim(),r=$('#cr').value.trim();if(!v||!r){$('#ce').textContent='Enter a value and a reason.';return}
const n='e'+Date.now().toString(36);e.st='superseded';

async function dlApp(){try{const d=await claude.use('downloads');if(!d){toast('Downloads are not available in this view');return}await d.save({filename:'medtrace.html',data:'<!DOCTYPE html>\n'+document.documentElement.outerHTML})}catch(e){toast('The file was not saved')}}
function chainOf(e){let c=[],x=e;while(x){c.unshift(x);x=x.sup&&ev(x.sup)}let n=S.ev.find(y=>y.sup===c[c.length-1].id);while(n){c.push(n);n=S.ev.find(y=>y.sup===n.id)}return c}

function graph(id){const N=nodes(ev(id)),k=N[N.length-1].k;return`<div class="pg">${N.map((n,i)=>(i?'<span class="gl"></span>':'')+`<button class="gn ${n.c}${n.k===k?' on':''}" data-k="${n.k}" onclick="gsel('${n.k}')"><b>${n.i} ${n.l}</b><small>${n.s}</small></button>`).join('')}</div><div id="gd">${detail(k)}</div>`}
function gsel(k){const g=document.querySelector('#ov #gd')||$('#gd');g.innerHTML=detail(k);g.parentElement.querySelectorAll('.gn').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function detail(k){const[id,t]=k.split(':'),v=ev(id),d=dc(v.doc),sg=sgOf(v),rv=rvOf(v),pr=v.sup&&ev(v.sup);
if(t==='src')return d?`<b>${d.name}</b> (${d.cat}, ${d.date})<div class="src" style="margin-top:8px;max-height:150px;overflow:auto">${hl(d,v.snip)}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="openDoc('${d.id}')">Open document</button><button class="btn" onclick="go('#/evidence/${v.id}')">Inspect evidence</button></div>`:'Not available. No source document is attached to this record.';

if(t==='rev')return rv?`<b>${rv.act}</b> by ${rv.actor} (${rv.role}) at ${rv.t}.<br>${rv.sum}`:v.st==='pending'?`Under review: no decision yet.<div class="row" style="margin-top:8px"><button class="btn" onclick="go('#/review/${v.id}')">Open review</button></div>`:'Not available. No review decision is recorded.';
if(t==='rec'||t==='upd')return`<b>${v.title}</b> ${bd(v.st)}<br>Version ${v.ver}, dated ${v.date}.<div class="row" style="margin-top:8px"><button class="btn" onclick="openEv('${v.id}')">Open record details</button></div>`;
return`<b>Correction to version ${pr?pr.ver:'?'}</b><br>Reason: ${v.why||'Not recorded'}<br>${rv?`Decided by ${rv.actor} (${rv.role}) at ${rv.t}.<br>`:''}${d?`Correction source: <button class="cite" onclick="openDoc('${d.id}')">${d.name}</button><br>`:'Correction source: not available.<br>'}${pr?`Previous version: <button class="cite" onclick="openEv('${pr.id}')">${pr.title}</button>`:''}`}
function fields(e){const d=dc(e.doc);if(!d)return{d:null,f:[]};const t=d.text,tl=t.toLowerCase(),sn=e.snip||d.snip,b=t.indexOf(sn),p=pt(e.pid),f=[];

const M={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'},dm=t.match(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* (\d{4})\b/),is=t.match(/\d{4}-\d{2}-\d{2}/),dx=dm||is,dv=dm?`${dm[3]}-${M[dm[2]]}-${dm[1].padStart(2,'0')}`:is?is[0]:null;

let ES={id:null,k:null},VS={root:null,i:0,cmp:false,id:null};

function backTo(id){const e=ev(id);go('#/patient/'+e.pid+'/timeline');setTimeout(()=>openEv(id),60)}

return`${bk}<h1>Evidence inspector</h1><p class="sub">${e.title} ${bd(e.st)}<br>${mode}. "Source linked" only means the value appears in the document. It does not mean the value is medically verified, and nothing here changes the record until a clinician approves it.</p>
<div class="grid g2"><div class="card"><h3>${d.name}</h3><p class="mu">${d.cat}, ${d.date}. Click highlighted text to see its field.</p>${IMG[d.id]?`<img src="${IMG[d.id]}" alt="Uploaded file" style="max-width:100%;margin-bottom:10px">`:''}<div class="src">${o.join('')}</div></div>

<div class="row" style="margin-top:14px"><button class="btn p" onclick="backTo('${cur.id}')">Back to current record</button><button class="btn" onclick="go('#/evidence/${v.id}')">Inspect evidence for version ${v.ver}</button></div>`}
function extractSim(){const f=UP.file;let n=0;const t=setInterval(()=>{n+=10;$('#pg').innerHTML=`<p class="mu">Reading ${f.name} (${n}%)</p><div class="bar"><i style="width:${n}%"></i></div>`;if(n>=100){clearInterval(t);fin()}},170)}

(S.ud||[]).forEach(d=>DOCS.some(x=>x.id===d.id)||DOCS.push(d));
